<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Christmas shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-container">
          <div class="logo-box">
            <div class="logo">
              <img src="assets/icons/Vector.svg" alt="logo" />
            </div>
            <p class="action-small logo-font">the gifts</p>
          </div>
          <nav class="nav action-small">
            <ul class="nav-list">
              <li class="nav-item">
                <a href="#gifts" class="nav-link">gifts</a>
              </li>
              <li class="nav-item">
                <a href="#about" class="nav-link">about</a>
              </li>
              <li class="nav-item">
                <a href="#best" class="nav-link">best</a>
              </li>
              <li class="nav-item">
                <a href="#contacts" class="nav-link">contacts</a>
              </li>
            </ul>
          </nav>
        </div>
      </header>
      <main class="main">
        <div class="main-border">
          <div class="main-container">
            <div class="gifts-section">
                
            </div>
        </div>
      </main>
      <footer class="footer">
        <div class="footer-container">
          <div class="contacts-container" id="contacts">
            <div class="contacts">
              <img class="contacts-icon" src="assets/icons/santa-claus.svg" alt="santa-claus" />
              <p class="actrion-large">+375 (29) 111-22-33</p>
              <h3 class="h3">call us</h3>
            </div>
            <div class="contacts-center">
              <img class="contacts-icon" src="assets/icons/christmas-tree.svg" alt="christmas-tree" />
              <p class="actrion-large">magic forest</p>
              <h3 class="h3">meet us</h3>
            </div>
            <div class="contacts">
              <img class="contacts-icon" src="assets/icons/snake.svg" alt="snake" />
              <p class="actrion-large">gifts@magic.com</p>
              <h3 class="h3">write us</h3>
            </div>
          </div>
          <div class="copyright-container">
            <div class="socials">
              <img class="social-icon" src="assets/icons/telegram.svg" alt="telegram" />
              <img class="social-icon" src="assets/icons/facebook.svg" alt="facebook" />
              <img class="social-icon" src="assets/icons/instagram.svg" alt="instagram" />
              <img class="social-icon" src="assets/icons/X.svg" alt="X" />
            </div>
            <p class="copyright">© Copyright 2025, All Rights Reserved</p>
            <p class="caption dark">Made in Rolling Scopes School</p>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
